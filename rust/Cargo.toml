[package]
name = "cassetter"
version = "0.0.0"
edition = "2021"
rust-version = "1.83"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "0.0.29"
flate2 = "1"
brotli = { version = "8", default-features = false, features = ["std"] }
zstd = { version = "0.13", default-features = false }
regex = "1"
unicode-normalization = "0.1"
pythonize = "0.29"
toml = "0.8"
base64 = "0.22"

[lints.clippy]
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
# `panic = "abort"` must NOT be set: PyO3 wraps every pymethod body in
# `catch_unwind` to turn a panic into a Python exception, and aborting would
# take the whole interpreter down instead.
strip = "symbols"
