[project]
name = "cassetter"
dynamic = ["version"]
description = "Rust-powered HTTP cassette recorder for Python tests. Safe by default."
readme = "README.md"
authors = [
    { name = "Marcelo Trylesinski", email = "marcelotryle@gmail.com" },
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://kludex.github.io/cassetter/"
Documentation = "https://kludex.github.io/cassetter/"
Repository = "https://github.com/Kludex/cassetter"
Issues = "https://github.com/Kludex/cassetter/issues"
Changelog = "https://github.com/Kludex/cassetter/releases"

[project.optional-dependencies]
httpx = ["httpx>=0.24"]
aiohttp = ["aiohttp>=3.9"]
requests = ["requests>=2.28"]
grpc = ["grpcio>=1.60"]
websockets = ["websockets>=12.0"]
pyreqwest = ["pyreqwest-impersonate>=0.5"]
httpx2 = [
    "httpx2>=2.0",
]

[project.scripts]
cassetter = "cassetter.cli:main"

[project.entry-points.pytest11]
cassetter = "cassetter.pytest_plugin"

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "cassetter._core"
features = ["pyo3/extension-module"]
manifest-path = "rust/Cargo.toml"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "coverage[toml]>=7.0",
    "mypy>=1.8",
    "ruff>=0.3",
    "maturin>=1.7",
    "anyio[trio]>=4.0",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "requests>=2.28",
    "logfire>=2.0",
    "trustme>=1.0",
    "pyyaml>=6.0.3",
    "pytest-cov>=7.0.0",
    "types-requests>=2.32.4.20260107",
    "grpcio>=1.60",
    "websockets>=12.0",
    "pyreqwest-impersonate>=0.5",
    "vcrpy>=8.1.1",
    "pytest-codspeed>=3.2",
    "httpx2>=2.0",
    "pytest-xdist>=3.8.0",
    "types-pyyaml>=6.0.12.20260724",
]
docs = [
    "zensical>=0.0.46",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "FA", "UP", "RUF100"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
strict = true
files = ["src", "tests", "benchmarks"]

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*", "google.protobuf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyreqwest_impersonate", "pyreqwest_impersonate.*"]
ignore_missing_imports = true

# vcrpy is installed but ships no py.typed; it is only used by the comparison
# benchmarks.
[[tool.mypy.overrides]]
module = ["vcr", "vcr.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
strict_config = true
strict_markers = true
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "vcr: Mark test to use VCR cassette recording/replay",
    "benchmark: CodSpeed benchmark",
]

[tool.coverage.run]
source_pkgs = ["cassetter", "tests"]

[tool.coverage.paths]
cassetter = ["src/cassetter", "*/site-packages/cassetter"]

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
