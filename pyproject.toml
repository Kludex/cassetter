[project]
name = "vcr-but-better"
version = "0.1.0"
description = "Rust-powered HTTP cassette recorder for Python tests. Safe by default, no monkey-patching."
readme = "README.md"
authors = [
    { name = "Marcelo Trylesinski", email = "marcelotryle@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
httpx = ["httpx>=0.24"]
aiohttp = ["aiohttp>=3.9"]
requests = ["requests>=2.28"]

[project.entry-points.pytest11]
vcr_but_better = "vcr_but_better.pytest_plugin"

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "vcr_but_better._core"
features = ["pyo3/extension-module"]
manifest-path = "rust/Cargo.toml"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "coverage[toml]>=7.0",
    "mypy>=1.8",
    "ruff>=0.3",
    "maturin>=1.7",
    "anyio[trio]>=4.0",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "requests>=2.28",
    "logfire>=2.0",
    "trustme>=1.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "FA", "UP", "RUF100"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
strict = true

[tool.pytest.ini_options]
strict_config = true
strict_markers = true
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "vcr: Mark test to use VCR cassette recording/replay",
]

[tool.coverage.run]
source_pkgs = ["vcr_but_better", "tests"]

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
