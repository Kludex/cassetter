version: 2
updates:
  # serde-saphyr is on the critical path for parsing every cassette and is
  # still 0.0.x, which cargo pins exactly - only dependabot can move it.
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns:
          - "*"
