name: Publish to PyPI

on:
  release:
    types: [published]
  # Lets the wheel matrix be smoke-tested before a tag exists, instead of
  # discovering a broken leg after the release is already immutable.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
          - os: ubuntu-latest
            target: aarch64
            manylinux: musllinux_1_2
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x86_64
    steps:
      - uses: actions/checkout@v7
      # The Linux legs run maturin inside the manylinux container, which ships
      # its own interpreters. macOS and Windows run it natively, where only one
      # Python exists unless it is installed first.
      - if: matrix.os != 'ubuntu-latest'
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
          allow-prereleases: true
      - name: Set version from tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" rust/Cargo.toml && rm -f rust/Cargo.toml.bak
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path rust/Cargo.toml --interpreter python3.10 python3.11 python3.12 python3.13 python3.14
          manylinux: ${{ matrix.manylinux || 'auto' }}
      # Free-threaded CPython uses its own ABI tag, so a cp314 wheel will not
      # install there and the module declares gil_used = false. It is installed
      # only now because a free-threaded 3.14 answers to `python3.14` as well,
      # and maturin picks it over the GIL build - on Windows whatever the PATH
      # order - which would leave the release with no cp314 wheel. 3.13t is not
      # shipped at all: PyO3 refuses the free-threaded build below 3.14.
      - if: matrix.os != 'ubuntu-latest'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14t"
          allow-prereleases: true
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path rust/Cargo.toml --interpreter python3.14t
          manylinux: ${{ matrix.manylinux || 'auto' }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'auto' }}
          path: dist/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set version from tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" rust/Cargo.toml && rm -f rust/Cargo.toml.bak
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path rust/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [build-wheels, build-sdist]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
