name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run maturin develop --release
      - uses: CodSpeedHQ/action@v5.2.1
        with:
          # v4 requires the mode that v3 picked on its own. `simulation` is what
          # it chose for a hosted runner, under its old name `instrumentation`,
          # so the numbers stay comparable with everything recorded so far -
          # `walltime` measures something else and is noisy on a shared VM.
          mode: simulation
          run: uv run pytest benchmarks/test_bench.py --codspeed
