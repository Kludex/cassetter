name: Validate Go release

on:
  push:
    tags: ["go/v*"]
  workflow_call:
    inputs:
      version:
        description: Go module version with the `v` prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25.x", stable]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: false
      - name: Validate module tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          VERSION=${RELEASE_VERSION:-${GITHUB_REF_NAME#go/}}
          python3 - "$VERSION" <<'PY'
          import re
          import sys

          version = sys.argv[1]
          match = re.fullmatch(
              r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
              r"(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?",
              version,
          )
          if match is None:
              raise SystemExit(f"invalid canonical Go module version: {version}")
          prerelease = match.group(4)
          if prerelease is not None:
              for identifier in prerelease.split("."):
                  if identifier.isdigit() and len(identifier) > 1 and identifier.startswith("0"):
                      raise SystemExit(f"invalid canonical Go module version: {version}")
          if int(match.group(1)) >= 2:
              raise SystemExit("Go v2+ requires a /vN suffix in the module path")
          PY
          test "$(go list -m)" = "github.com/Kludex/cassetter/go"
      - run: go test -race ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
          working-directory: go
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
