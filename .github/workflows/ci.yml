name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # cargo test links against libpython (the extension-module feature is
      # only enabled by maturin when building the wheel)
      - run: sudo apt-get update && sudo apt-get install -y libpython3-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  go-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: go

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # wheels are published for macOS and Windows, so test them too
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
          # No free-threaded leg. 3.13t cannot be built at all - PyO3 refuses
          # the free-threaded build of CPython below 3.14 - and on 3.14t
          # `python -c "import pyreqwest_impersonate"` segfaults with nothing
          # else imported. The 3.13t leg that used to sit here never exercised
          # free-threading either: uv picks a free-threaded interpreter only
          # when asked for one by name, so it silently repeated the 3.12 run.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run maturin develop --release
      - run: uv run coverage run -m pytest tests/ --strict-config --strict-markers -v
      # The coverage gate is measured on Linux only: the mac/Windows matrix
      # entries verify platform compatibility, and OS-conditional tests (e.g.
      # POSIX file-permission tests skipped on Windows) would otherwise leave
      # their bodies uncovered there.
      - if: matrix.os == 'ubuntu-latest'
        run: uv run coverage report

  node:
    runs-on: ${{ matrix.os }}
    # `npm ci` and the native build run dependency lifecycle and build scripts,
    # so keep the checkout token away from them.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ["18", "20", "22"]
        include:
          # the addon is built per platform, so check the ones we publish for
          - os: macos-latest
            node-version: "22"
          - os: windows-latest
            node-version: "22"
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build:native
      - run: npm run typecheck
      - run: npm test

  # https://github.com/marketplace/actions/alls-green#why used for branch protection checks
  check:
    if: always()
    needs: [lint, rust-test, go-test, audit, test, node]
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
