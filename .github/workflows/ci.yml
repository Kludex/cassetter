name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # cargo test links against libpython (the extension-module feature is
      # only enabled by maturin when building the wheel)
      - run: sudo apt-get update && sudo apt-get install -y libpython3-dev
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The manifest and lockfile live in rust/; the action defaults to the
          # repository root, where there is no Cargo.toml to scan.
          working-directory: rust

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # wheels are published for macOS and Windows, so test them too
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
          # The module declares itself free-threading safe (gil_used = false),
          # so the free-threaded build has to actually be exercised.
          - os: ubuntu-latest
            python-version: "3.13t"
          - os: ubuntu-latest
            python-version: "3.14t"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: uv sync
      - run: uv run maturin develop --release
      - run: uv run coverage run -m pytest tests/ --strict-config --strict-markers -v
      # The coverage gate is measured on Linux only: the mac/Windows matrix
      # entries verify platform compatibility, and OS-conditional tests (e.g.
      # POSIX file-permission tests skipped on Windows) would otherwise leave
      # their bodies uncovered there.
      - if: matrix.os == 'ubuntu-latest' && !endsWith(matrix.python-version, 't')
        run: uv run coverage report

  # https://github.com/marketplace/actions/alls-green#why used for branch protection checks
  check:
    if: always()
    needs: [lint, rust-test, audit, test]
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
